# Serves the built app and forwards API, upload and Socket.IO traffic to the backend, so the
# browser sees one origin (no CORS, SameSite=lax cookies work). ${API_UPSTREAM} is filled in
# by the nginx image's template step at container start.

# Keep the original scheme when HTTPS ends at a proxy in front of this one (e.g. Caddy)
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Chat attachments are up to 25 MB
  client_max_body_size 30m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Docker's DNS, re-resolved at request time so a restarted backend container is found again
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api ${API_UPSTREAM};

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  location /api/ {
    proxy_pass $api;
  }

  location /uploads/ {
    proxy_pass $api;
  }

  location /socket.io/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    # Setting any header here drops the inherited ones, so repeat them
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Vite puts content-hashed files here, so they never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Must be re-checked on every load so new deploys (and push handling) reach users
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes (/chat, /stream/:id, ...) all load the app
  location / {
    try_files $uri $uri/ /index.html;
  }
}
